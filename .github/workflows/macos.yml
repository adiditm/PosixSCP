# Builds the universal (Apple Silicon + Intel) macOS app, unsigned, then packages one thin .app per
# architecture for the release:
#
#   PosixSCP-macos-arm64.zip    Apple Silicon
#   PosixSCP-macos-intel.zip    Intel (x86_64)
#
# Signing and notarization need a Developer ID certificate and are done afterwards with
# native/scripts/release-macos.sh on a machine that has one.
name: macOS

on:
  workflow_dispatch:
  push:
    branches: ["ci-*"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  universal:
    name: Universal app (arm64 + x86_64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          brew install ninja
          native/scripts/build-macos-universal.sh

      - name: Unit tests (arm64, and x86_64 under Rosetta)
        run: |
          ctest --test-dir native/build-universal --output-on-failure
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          arch -x86_64 native/build-universal/rtlcompat/test_rtlcompat
          arch -x86_64 native/build-universal/rtlcompat/test_format
          arch -x86_64 native/build-universal/rtlcompat/test_wintime
          arch -x86_64 native/build-universal/ui-qt/test_uilogic

      - name: Launch check of the staged bundle (both architectures, bundled Qt)
        run: |
          APP=native/build-universal/dist/PosixSCP.app/Contents/MacOS/PosixSCP
          for A in arm64 x86_64; do
            arch -$A env WINSCP_NO_AUTOLOGIN=1 WINSCP_SHOT=/tmp/shot-$A.png "$APP"
            test -s /tmp/shot-$A.png
            arch -$A native/build-universal/dist/winscp-harness no-such-host.invalid 22 a b 2>&1 | tee /tmp/h.txt || true
            grep -q 'does not exist' /tmp/h.txt
          done

      - name: Package per-architecture zips
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                       native/build-universal/dist/PosixSCP.app/Contents/Info.plist)"
          native/scripts/package-macos.sh "$VERSION" native/build-universal/dist/PosixSCP.app dist

      - name: Launch check of the packaged (thin) apps
        run: |
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          rm -rf /tmp/dl-* && mkdir -p /tmp/dl-arm64 /tmp/dl-intel
          ditto -x -k dist/PosixSCP-macos-arm64.zip /tmp/dl-arm64
          ditto -x -k dist/PosixSCP-macos-intel.zip /tmp/dl-intel
          test "$(lipo -archs /tmp/dl-arm64/PosixSCP.app/Contents/MacOS/PosixSCP)" = arm64
          test "$(lipo -archs /tmp/dl-intel/PosixSCP.app/Contents/MacOS/PosixSCP)" = x86_64
          # Prove portability: hide the build-time Qt so only the bundled frameworks can satisfy it.
          # (Without this, an absolute rpath back into build-deps would still work on this runner.)
          mv native/build-deps/qt native/build-deps/qt.hidden
          trap 'mv native/build-deps/qt.hidden native/build-deps/qt' EXIT
          arch -arm64 env WINSCP_NO_AUTOLOGIN=1 WINSCP_SHOT=/tmp/pack-arm64.png \
            /tmp/dl-arm64/PosixSCP.app/Contents/MacOS/PosixSCP
          arch -x86_64 env WINSCP_NO_AUTOLOGIN=1 WINSCP_SHOT=/tmp/pack-intel.png \
            /tmp/dl-intel/PosixSCP.app/Contents/MacOS/PosixSCP
          mv native/build-deps/qt.hidden native/build-deps/qt
          trap - EXIT
          test -s /tmp/pack-arm64.png && test -s /tmp/pack-intel.png

      - uses: actions/upload-artifact@v4
        with:
          name: PosixSCP-macOS
          path: |
            dist/PosixSCP-macos-arm64.zip
            dist/PosixSCP-macos-intel.zip
            native/build-universal/dist/PosixSCP-macOS-unsigned.tar
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/PosixSCP-macos-arm64.zip dist/PosixSCP-macos-intel.zip --clobber
